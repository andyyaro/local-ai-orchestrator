<template>
  <style>
    @font-face { font-family: "FilmText"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "FilmText"; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "FilmDisplay"; src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; }
    /* the hook, Outbreak's dot story: the copy on the left, the words as dots on the right */
    #s1-field { position: absolute; left: 0; top: 0; width: 1920px; height: 1080px; overflow: visible; }
    #s1-copy { position: absolute; left: 150px; top: 330px; width: 760px; }
    #s1-kick { position: relative; }
    #s1-head { position: relative; margin-top: 10px; }
    .s1-row { display: flex; align-items: center; gap: 16px; margin-top: 22px; font-weight: 500; font-size: 36px; line-height: 44px; letter-spacing: -0.01em; color: var(--label-2); white-space: nowrap; }
    .s1-row b { font-weight: 600; color: var(--label); }
    #s1-r1 { margin-top: 40px; }
    #s1-r1 .dot { background: #3a3a3c; }
    #s1-r2 .dot { background: #c7c7cc; }
    #s1-pass { display: inline-flex; align-items: center; gap: 16px; margin-top: 40px; height: 68px; padding: 0 32px 0 26px; border-radius: 34px;
      background: var(--fill-3); font-weight: 600; font-size: 36px; letter-spacing: -0.012em; color: var(--label); white-space: nowrap; }
    #s1-pass .dot { background: var(--green); }
    #s1-pass span.sep { color: var(--label-2); font-weight: 500; }
    #s1-copy .kick, #s1-copy .head { position: relative; }
  </style>
  <div id="root" data-composition-id="s1-open" data-width="1920" data-height="1080">
    <svg id="s1-field" viewBox="0 0 1920 1080" aria-hidden="true" data-layout-allow-overflow>
      <circle id="s1-ring" cx="1290" cy="540" r="152" fill="none" stroke="#1F7A4D" stroke-width="3" />
      <g id="s1-dots"></g>
    </svg>
    <div id="s1-copy">
      <div id="s1-kick" class="kick">July 2026 <span>· a test run of this project</span></div>
      <div id="s1-head" class="head">Ask for 50 words.</div>
      <div id="s1-r1" class="s1-row"><span class="dot"></span><span><b class="num">50</b> words asked</span></div>
      <div id="s1-r2" class="s1-row"><span class="dot"></span><span>about <b class="num" id="s1-n">450</b> words came back</span></div>
      <div id="s1-pass"><span class="dot"></span><span class="num">88/100</span><span class="sep">·</span><span>Passed</span></div>
    </div>
  </div>
  <script>
    (function () {
      const { WA, EO, EI, EIO } = window.FILM;
      const TM = window.TM;
      const S0 = TM.s1[0], S1 = TM.s1[1];
      const W = (k, w, nth) => WA(k, w, nth) - S0;
      const tl = gsap.timeline({ paused: true });
      const NS = "http://www.w3.org/2000/svg";
      const rise = (el, t, d = 0.6, dy = 22) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: EO, immediateRender: false }, t - 0.04);

      // the words as dots, in a phyllotaxis disc: the 50 asked for at the centre (dark), the rest of the essay around them
      const CX = 1290, CY = 540, C = 19, N = 450, ASKED = 50, PHI = Math.PI * (3 - Math.sqrt(5));
      const g = document.querySelector("#s1-dots");
      const dots = [];
      for (let n = 0; n < N; n++) {
        const r = C * Math.sqrt(n + 0.5), th = n * PHI;
        const c = document.createElementNS(NS, "circle");
        const x = CX + r * Math.cos(th), y = CY + r * Math.sin(th);
        c.setAttribute("cx", x.toFixed(1)); c.setAttribute("cy", y.toFixed(1)); c.setAttribute("r", "6.5");
        c.setAttribute("fill", n < ASKED ? "#3A3A3C" : "#C7C7CC");
        g.appendChild(c); dots.push({ c, x, y, r });
      }
      gsap.set(dots.map((d) => d.c), { opacity: 0, scale: 0, transformOrigin: "50% 50%" });
      gsap.set(["#s1-kick", "#s1-head", "#s1-r1", "#s1-r2", "#s1-pass"], { opacity: 0 });
      gsap.set("#s1-ring", { opacity: 0, scale: 0.9, svgOrigin: "1290 540" });

      // "Ask for a fifty-word summary of why sleep matters."
      tl.fromTo("#s1-kick", { opacity: 0, y: 10 }, { opacity: 1, y: 0, duration: 0.6, ease: EO, immediateRender: false }, 0.15);
      rise("#s1-head", W("v01", "ask"));
      const a50 = W("v01", "50");
      tl.to(dots.slice(0, ASKED).map((d) => d.c), { opacity: 1, scale: 1, duration: 0.4, ease: EO, stagger: 0.011 }, a50);
      rise("#s1-r1", a50 + 0.1, 0.55, 14);
      tl.to("#s1-ring", { opacity: 1, scale: 1, duration: 0.7, ease: EO }, a50 + 0.7);

      // "It came back at about four hundred and fifty": the rest arrive calmly, spiralling out; the count runs with them
      const c0 = W("v02", "it"), c1 = W("v02", "450") + 0.75;
      const extra = dots.slice(ASKED).map((d) => d.c);
      tl.to(extra, { opacity: 1, scale: 1, duration: 0.35, ease: EO, stagger: (c1 - c0 - 0.35) / extra.length }, c0);
      rise("#s1-r2", c0, 0.55, 14);
      const cnt = { v: ASKED };
      const nEl = document.querySelector("#s1-n");
      tl.fromTo(cnt, { v: ASKED }, { v: N, duration: c1 - c0, ease: "none", immediateRender: false,
        onUpdate: () => { nEl.textContent = Math.round(cnt.v); } }, c0);
      tl.set(nEl, { textContent: "450" }, c1 + 0.01);
      tl.to("#s1-ring", { opacity: 0.35, duration: 0.6, ease: EO }, c1);

      // "and still scored eighty-eight: a pass."
      tl.fromTo("#s1-pass", { opacity: 0, scale: 0.9, transformOrigin: "0% 50%" }, { opacity: 1, scale: 1, duration: 0.5, ease: EO, immediateRender: false }, W("v02", "88") - 0.02);

      // the words draw in to the dial's centre, where the mark lands on the drop (s2: the tile's centre)
      const DX = 604, DY = 434, IN = TM.drop - S0;
      tl.to(["#s1-copy"], { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: EI }, IN - 1.25);
      tl.to("#s1-ring", { opacity: 0, duration: 0.3, ease: EI }, IN - 1.25);
      dots.forEach((d, i) => {
        const delay = (d.r / (C * Math.sqrt(N))) * 0.22;
        tl.to(d.c, { attr: { cx: DX, cy: DY }, duration: 0.95 - delay, ease: "power3.in" }, IN - 1.0 + delay);
        tl.to(d.c, { opacity: 0, duration: 0.18, ease: "none" }, IN - 0.2);
      });
      window.__timelines["s1-open"] = tl;
    })();
  </script>
</template>
