<template>
  <style>
    @font-face { font-family: "FilmText"; src: url("assets/fonts/Inter-Medium.woff2") format("woff2"); font-weight: 500; font-display: block; }
    @font-face { font-family: "FilmText"; src: url("assets/fonts/Inter-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    @font-face { font-family: "FilmDisplay"; src: url("assets/fonts/InterDisplay-SemiBold.woff2") format("woff2"); font-weight: 600; font-display: block; }
    #root { position: absolute; inset: 0; }
    /* the lockup on the drop: the dial tile (icon-rounded.svg) beside the wordmark (lockup-black.svg's, in the brand forest) */
    #s2-tile { position: absolute; left: 526px; top: 356px; width: 156px; height: 156px; overflow: visible; }
    #s2-word { position: absolute; left: 722px; top: 395px; width: 672.1px; height: 78px; display: block; }
    #s2-line { position: absolute; left: 0; top: 584px; width: 1920px; text-align: center; font-weight: 500; font-size: 36px; line-height: 44px; letter-spacing: -0.01em; color: var(--label-2); white-space: nowrap; }
    #s2-line span { display: inline-block; }
    #s2-rule { position: absolute; left: 0; top: 664px; width: 1920px; text-align: center; font-family: "FilmDisplay", sans-serif; font-weight: 600; font-size: 62px; line-height: 74px; letter-spacing: -0.02em; color: var(--label); white-space: nowrap; }
    #s2-rule span { display: inline-block; }
  </style>
  <div id="root" data-composition-id="s2-lockup" data-width="1920" data-height="1080">
    <svg id="s2-tile" viewBox="0 0 120 120" aria-label="local-ai-orchestrator icon">
      <rect width="120" height="120" rx="26.4" fill="#1E2A1A" />
      <g transform="translate(60 60) scale(0.68) translate(-60 -60)">
        <circle cx="60" cy="68" r="40" fill="#C5D86D" />
        <path id="s2-ptr" d="M60 68 L 84.25 54.00" fill="none" stroke="#1E2A1A" stroke-width="9" stroke-linecap="round" />
        <circle cx="14.97" cy="42.00" r="5.5" fill="#C5D86D" fill-opacity="0.451" />
        <circle cx="60.00" cy="16.00" r="5.5" fill="#C5D86D" fill-opacity="0.451" />
        <circle cx="105.03" cy="42.00" r="7" fill="#F1EEDC" />
      </g>
    </svg>
    <img id="s2-word" src="assets/brand/wordmark-forest.svg" alt="local-ai-orchestrator" />
    <div id="s2-line"><span id="s2-l1">Seven local agents</span> <span id="s2-l2">· deterministic validators</span> <span id="s2-l3">· no paid APIs</span></div>
    <div id="s2-rule"><span>A</span> <span>model</span> <span>can’t</span> <span>mark</span> <span>its</span> <span>own</span> <span>homework.</span></div>
  </div>
  <script>
    (function () {
      const { WA, EO, EI, EIO } = window.FILM;
      const TM = window.TM;
      const S0 = TM.s2[0], S1 = TM.s2[1];
      const W = (k, w, nth) => WA(k, w, nth) - S0;
      const tl = gsap.timeline({ paused: true });
      const rise = (el, t, d = 0.55, dy = 18) =>
        tl.fromTo(el, { opacity: 0, y: dy, filter: "blur(5px)" }, { opacity: 1, y: 0, filter: "blur(0px)", duration: d, ease: EO, immediateRender: false }, t - 0.04);

      gsap.set(["#s2-tile", "#s2-word", "#s2-l1", "#s2-l2", "#s2-l3", "#s2-rule span"], { opacity: 0 });
      gsap.set("#s2-ptr", { rotation: -120, svgOrigin: "60 68" });

      // on the drop the tile grows out of the point the words drew in to, and the pointer settles: from the left dot,
      // past the top dot, to the cream dot (the real mark's pose)
      tl.fromTo("#s2-tile", { opacity: 0, scale: 0.25, transformOrigin: "50% 50%" }, { opacity: 1, scale: 1, duration: 0.8, ease: EO, immediateRender: false }, 0);
      tl.to("#s2-ptr", { rotation: 0, svgOrigin: "60 68", duration: 1.25, ease: EIO }, 0.3);
      // "Local AI Orchestrator": the wordmark wipes in beside it
      const nm = W("v03", "local");
      tl.fromTo("#s2-word", { opacity: 0, x: -18, clipPath: "inset(0% 100% 0% 0%)" }, { opacity: 1, x: 0, clipPath: "inset(0% 0% 0% 0%)", duration: 1.1, ease: EO, immediateRender: false }, nm);

      // "Seven local agents, no paid API calls": the brand sheet's own line
      rise("#s2-l1", W("v04", "seven"));
      rise("#s2-l2", W("v04", "agents") + 0.35);
      rise("#s2-l3", W("v04", "no"));
      // "and one rule: a model can't mark its own homework." word by word, on the voice
      const RW = ["a", "model", "cant", "mark", "its", "own", "homework"];
      document.querySelectorAll("#s2-rule span").forEach((s, i) => rise(s, W("v04", RW[i]), 0.5, 20));

      tl.to(["#s2-tile", "#s2-word", "#s2-line", "#s2-rule"], { opacity: 0, filter: "blur(6px)", duration: 0.35, ease: EI }, S1 - S0 - 0.45);
      window.__timelines["s2-lockup"] = tl;
    })();
  </script>
</template>
